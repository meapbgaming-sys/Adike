
name: Build Adike 2026 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Install Android SDK
        shell: bash
        run: |
          SDK="$ANDROID_HOME"
          echo "Android SDK: $SDK"

          SDKMANAGER="$SDK/cmdline-tools/16.0/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)
          fi

          echo "Using: $SDKMANAGER"

          "$SDKMANAGER" --sdk_root="$SDK" --licenses </dev/null || true

          "$SDKMANAGER" --sdk_root="$SDK" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Adike-2026-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
